name: Flathub Assets

# Builds the frontend dependency tarballs the Flathub manifest needs
# (sandbox has no network for bun install). Runs per release tag on both
# arches because node_modules contains platform-specific native packages.
#
# Assets land on the GitHub release as:
#   qxchat-frontend-deps-<tag>-x86_64.tar.gz
#   qxchat-frontend-deps-<tag>-aarch64.tar.gz
# Layout inside (single top-level dir, symlink-safe, no tar --transform):
#   deps/node_modules/...
# After the release, copy the printed sha256 into
# flatpak/flathub/com.getqxchat.app.yml (frontend-deps url sources).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  frontend-deps:
    name: Frontend deps (${{ matrix.asset_arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            asset_arch: x86_64
          - runner: ubuntu-24.04-arm
            asset_arch: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install frontend dependencies
        run: cd client && bun install --frozen-lockfile

      - name: Assemble deps tarball (physical deps/ nesting, cp -a keeps symlinks)
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="qxchat-frontend-deps-${TAG}-${{ matrix.asset_arch }}.tar.gz"
          rm -rf /tmp/fedeps && mkdir -p /tmp/fedeps/deps
          cp -a client/node_modules /tmp/fedeps/deps/
          tar -czf "$ASSET" -C /tmp/fedeps deps
          echo "top level:" && tar -tzf "$ASSET" | awk -F/ '{print $1"/"$2}' | sort -u | head -n 3
          sha256sum "$ASSET" | tee /tmp/frontend-deps.sha256

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="qxchat-frontend-deps-${TAG}-${{ matrix.asset_arch }}.tar.gz"
          gh release upload "$TAG" "$ASSET" --clobber
          echo "sha256 for flatpak/flathub/com.getqxchat.app.yml:"
          cat /tmp/frontend-deps.sha256
