app-id: com.getqxchat.app
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: qxchat
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download
  - --env=G_APPLICATION_ID=com.getqxchat.app
modules:
  # Upstream Rust toolchain, assembled by scripts/build-flatpak.sh into a
  # proper prefix layout (rustc discovers its sysroot relative to itself).
  # Used IN PLACE from the build directory, never installed to /app:
  # flatpak-builder strips/debuginfos everything in /app at module commit,
  # which corrupts rustc's oddly-linked libLLVM.
  - name: qxchat
    buildsystem: simple
    build-commands:
      - |
        set -e
        if [ -x toolchain-install/bin/rustc ]; then TC=toolchain-install; else TC=.; fi
        export PATH="$PWD/$TC/bin:$PATH"
        export RUSTC="$PWD/$TC/bin/rustc"
        export CARGO_HOME="$PWD/.cargo-home"
        export CARGO_TARGET_DIR="$PWD/target"
        export CARGO_NET_OFFLINE=true
        # Keep sandbox compilation to 4 cores max (host stays usable).
        export CARGO_BUILD_JOBS=4
        # Bake /app/lib into the binary's search path: the tray stack is
        # dlopen'd at runtime by SONAME and the sandbox sets no
        # LD_LIBRARY_PATH. (This binary only ever ships in the Flatpak.)
        export RUSTFLAGS="-C link-args=-Wl,-rpath,/app/lib"
        cargo build --release --offline --frozen --manifest-path src-tauri/Cargo.toml
        install -d /app/lib
        # NOTE: plain cp keeps the nix store's read-only modes; the files
        # must be user-writable or flatpak-builder's strip step fails.
        cp -d tray-libs/*.so* /app/lib/
        chmod -R u+w /app/lib
        install -Dm755 target/release/qxchat /app/bin/qxchat
        install -Dm644 com.getqxchat.app.desktop /app/share/applications/com.getqxchat.app.desktop
        install -Dm644 com.getqxchat.app.metainfo.xml /app/share/metainfo/com.getqxchat.app.metainfo.xml
        install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.getqxchat.app.png
    sources:
      - type: dir
        path: staging/toolchain-install
      # Assembled by scripts/build-flatpak.sh: src-tauri (minus target/ and
      # Android build dirs), built frontend (client/dist), vendored cargo
      # deps + .cargo/config, tray stack (tray-libs/), desktop entry,
      # metainfo — all nested under app/ because flatpak-builder strips
      # the first archive path component.
      - type: archive
        path: staging/sources.tar.gz
